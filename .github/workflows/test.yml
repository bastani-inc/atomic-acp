name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Typecheck
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Format check
            run: npx prettier . --check
          - name: Unit and component tests
            run: npm test
          - name: Build
            run: npm run build

  test:
    name: test (all platforms)
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every platform job to have succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ',') }}"
          echo "work job results: $results"
          if [ -z "$results" ]; then
            echo "No work job results were reported; failing closed." >&2
            exit 1
          fi
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "A required work job did not succeed: $results" >&2
              exit 1
              ;;
          esac
