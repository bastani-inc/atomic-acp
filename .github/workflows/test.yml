name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job runs on one of bastani-inc/atomic's `namespace-profile-atomic-ci-*` runner profiles, never an
# inline `nscloud-*` label: this workflow runs fork pull requests, and only a profile can set Namespace's Access
# Level to Restricted. Each job keeps its own cache tag. See bastani-inc/atomic's docs/ci.md ("Runners").
jobs:
  checks:
    name: checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: namespace-profile-atomic-ci-linux-amd64-4x16;overrides.cache-tag=bastani-inc.atomic-acp.ci.checks.linux-amd64
          - platform: windows-x64
            runner: namespace-profile-atomic-ci-windows-amd64-4x16;overrides.cache-tag=bastani-inc.atomic-acp.ci.checks.windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure private Windows temp storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-temp.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Typecheck
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Format check
            run: npx prettier . --check
          - name: Unit and component tests
            run: npm test
          - name: Build
            run: npm run build

  test:
    name: test (all platforms)
    needs: [checks]
    if: always()
    runs-on: namespace-profile-atomic-ci-linux-amd64-4x16;overrides.cache-tag=bastani-inc.atomic-acp.ci.test.linux-amd64
    timeout-minutes: 1
    steps:
      - name: Require every platform job to have succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ',') }}"
          echo "work job results: $results"
          if [ -z "$results" ]; then
            echo "No work job results were reported; failing closed." >&2
            exit 1
          fi
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "A required work job did not succeed: $results" >&2
              exit 1
              ;;
          esac
