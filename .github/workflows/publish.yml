name: Publish
run-name: Publish ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., 0.1.0 or 0.1.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  integrity:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      npm-tag: ${{ steps.verify.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.[1-9][0-9]*)?'
          [[ "$RELEASE_TAG" =~ ^$version_re$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse 'HEAD^{commit}')
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$sha" == "$tag_sha" ]] || { echo "Checked-out ref does not resolve to tag commit $tag_sha" >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "Tag commit $sha is not on main" >&2; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [[ "$version" == "$RELEASE_TAG" ]] || { echo "Package version $version does not match tag $RELEASE_TAG" >&2; exit 1; }
          subject=$(git show -s --format=%s HEAD)
          [[ "$subject" == "Release $RELEASE_TAG" ]] || { echo "Commit subject must be 'Release $RELEASE_TAG'; found: $subject" >&2; exit 1; }
          npm_tag=latest
          [[ "$version" == *-alpha.* ]] && npm_tag=next
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Typecheck
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Format check
            run: npx prettier . --check
          - name: Unit and component tests
            run: npm test

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          tarball="./release-assets/bastani-atomic-acp-${{ needs.integrity.outputs.version }}.tgz"
          test -f "$tarball"
          listing=$(mktemp)
          tar -tzf "$tarball" > "$listing"
          grep -qx 'package/dist/index.js' "$listing"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [[ -n "$prev" ]]; then
            range="${prev}..${RELEASE_TAG}"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${RELEASE_TAG}"
          else
            range="${RELEASE_TAG}"
            compare="https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
            echo
            echo
            echo "[Full Changelog](${compare})"
          } > release-assets/RELEASE_NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    name: Stage draft GitHub Release
    needs: [integrity, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate and stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          tarball="bastani-atomic-acp-${{ needs.integrity.outputs.version }}.tgz"
          sha256sum "$tarball" > SHA256SUMS
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != false ]] || { echo "GitHub Release $RELEASE_TAG is already published. Refusing to mutate a public release." >&2; exit 1; }
          [[ "$existing" != true ]] || gh release delete "$RELEASE_TAG" --yes
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md "$tarball" SHA256SUMS

  publish-npm:
    name: Publish npm package
    needs: [integrity, stage-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Publish atomic-acp
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
          NPM_TAG: ${{ needs.integrity.outputs.npm-tag }}
        run: |
          set -euo pipefail
          tarball="./release-assets/bastani-atomic-acp-${VERSION}.tgz"
          name=$(tar -xOf "$tarball" package/package.json | jq -er .name)
          version=$(tar -xOf "$tarball" package/package.json | jq -er .version)
          [[ "$version" == "$VERSION" ]] || { echo "$name has version $version, expected $VERSION" >&2; exit 1; }
          if npm view "$name@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$VERSION already exists; skipping."
          else
            npm publish "$tarball" --provenance --access public --tag "$NPM_TAG" --registry https://registry.npmjs.org
          fi

  publish-github-release:
    name: Publish GitHub Release
    needs: [stage-github-release, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" == true ]] || { echo "Draft GitHub Release $RELEASE_TAG does not exist." >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=${{ contains(env.RELEASE_TAG, '-') }} --latest=${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
